# ═══════════════════════════════════════════════════
#  AI Surveillance — Docker Compose
#
#  First time:
#    1. docker-compose up -d ollama
#    2. docker exec ollama ollama pull moondream
#    3. docker-compose up -d
#
#  Daily use:
#    docker-compose up -d
#    docker-compose logs -f surveillance
#    docker-compose down
# ═══════════════════════════════════════════════════

services:
  # ── Ollama — Local AI Server ───────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Surveillance App ───────────────────────────────
  surveillance:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-survillance:1.0.0
    container_name: surveillance
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
      - ./snapshots:/app/snapshots
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama_data:
    name: surveillance_ollama_models
